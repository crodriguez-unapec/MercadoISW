
name: Security CI

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --configuration Release --no-restore

      - name: Verify laboratory mode is disabled
        shell: bash
        run: |
          if grep -R -n -E 'LAB_MODE:[[:space:]]*["'\'']?true' \
            --include='docker-compose*.yml' .; then
            echo "Laboratory mode must not be enabled in deployment."
            exit 1
          fi

      - name: Build Docker image
        run: docker build -t isw-store:ci .

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.68.2 image \
            --image-src docker \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            --format table \
            isw-store:ci
